<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok OAuth Callback</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 500px;
      width: 90%;
      text-align: center;
    }
    h2 { color: #38bdf8; margin-top: 0; }
    .code-box {
      background: #0f172a;
      padding: 1rem;
      border-radius: 0.5rem;
      font-family: monospace;
      font-size: 1.1rem;
      word-break: break-all;
      margin: 1.5rem 0;
      border: 1px solid #334155;
      color: #a7f3d0;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <h2>TikTok Autorizado com Sucesso!</h2>
    <p>Copie o código de autorização gerado abaixo para concluir a configuração:</p>
    <div id="code" class="code-box">Carregando código...</div>
    <button onclick="copyCode()">Copiar Código</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const codeDiv = document.getElementById('code');
    if (code) {
      codeDiv.innerText = code;
    } else {
      codeDiv.innerText = 'Nenhum código encontrado na URL.';
    }

    function copyCode() {
      navigator.clipboard.writeText(code).then(() => {
        alert('Código copiado para a área de transferência!');
      });
    }
  </script>
</body>
</html>
